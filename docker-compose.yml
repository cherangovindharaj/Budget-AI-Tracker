version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: budget-ai-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootroot
      MYSQL_DATABASE: jwt_demo
      MYSQL_USER: root
      MYSQL_PASSWORD: demo@
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - budget-ai-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootroot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: budget-ai-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/jwt_demo?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=demo@
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - PORT=8080
      - FRONTEND_URL=http://localhost:3000
    networks:
      - budget-ai-network
    depends_on:
      mysql-db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/expensive_tracker
      args:
        - VITE_API_URL=http://localhost:8080
    container_name: budget-ai-frontend
    restart: always
    ports:
      - "3000:80"
    networks:
      - budget-ai-network
    depends_on:
      - backend

volumes:
  mysql_data:

networks:
  budget-ai-network:
    driver: bridge
