spring.application.name=jpademo

# Database Connection Mappings
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/jwt_demo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server Port Mappings (Render injects PORT automatically)
server.port=${PORT:8080}
spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:admin}

# Allowed CORS origins (configured via FRONTEND_URL environment variable)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000,http://localhost:5173,http://localhost:8080}

# JWT Encryption Key (configured via JWT_SECRET)
jwt.secret=${JWT_SECRET:budgetaitrackersupersecuredefaultsecretkeythatisatleast32byteslong}
