spring.application.name=jpademo

# Database Connection - supports both PostgreSQL (Render) and MySQL (local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jwt_demo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA Settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.format_sql=true

# Server Port (Render injects PORT automatically)
server.port=${PORT:8080}
spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:admin}

# Allowed CORS origins
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000,http://localhost:5173,http://localhost:8080}

# JWT Encryption Key
jwt.secret=${JWT_SECRET:budgetaitrackersupersecuredefaultsecretkeythatisatleast32byteslong}
