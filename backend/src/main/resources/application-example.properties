spring.application.name=jpademo

spring.datasource.url=jdbc:mysql://localhost:3306/jwt_demo
spring.datasource.username=YOUR_MYSQL_USERNAME
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

server.port=8080
spring.security.user.name=admin
spring.security.user.password=admin

# CORS Frontend application URL
FRONTEND_URL=http://localhost:3000

# JWT signing key (minimum 32 characters/256 bits for HMAC-SHA256)
JWT_SECRET=YOUR_SUPER_SECURE_JWT_SECRET_KEY_AT_LEAST_32_BYTES_LONG